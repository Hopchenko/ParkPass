  <g fill="#EAD9B6">
    <path d="M295 472 L348 458 L372 480 L342 492 L302 485 Z"/>
    <path d="M358 490 L398 478 L418 498 L388 508 Z"/>
    <path d="M720 358 L770 332 L805 365 L772 382 L728 372 Z"/>
  </g>

  <!-- Foreground left hill -->
  <path
    fill="#7A7E86"
    stroke="#EAD9B6"
    stroke-width="7"
    stroke-linejoin="round"
    d="M0 740
       C140 655 280 675 430 755
       C500 800 545 870 560 1000
       L0 1000
